<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="sG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1877f2" />
      <stop offset="100%" style="stop-color:#00c6ff" />
    </linearGradient>
  </defs>
  <rect width="400" height="100" fill="#0a0a1a" rx="12"/>
  <rect x="0" y="0" width="200" height="100" fill="#0d0d1f" rx="12"/>
  <text x="20" y="30" font-family="Arial" font-size="14" fill="#00c6ff">★ Stars</text>
  <text x="20" y="65" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">8</text>
  <rect x="200" y="0" width="200" height="100" fill="#0d0d1f" rx="12"/>
  <text x="220" y="30" font-family="Arial" font-size="14" fill="#ea4335">📂 Repos</text>
  <text x="220" y="65" font-family="Arial" font-size="24" font-weight="bold" fill="#fff">11</text>
  <!-- Animated gradient line -->
  <rect x="0" y="98" width="400" height="2" fill="url(#sG)" opacity="0.5">
    <animate attributeName="x" values="0;400;0" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
