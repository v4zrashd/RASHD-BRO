<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1877f2;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#d62976;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#fbbc05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="250" fill="url(#g2)"/>
  <!-- Animated particles -->
  <circle cx="50" cy="50" r="2" fill="#1877f2" opacity="0.8"><animate attributeName="cy" values="50;200;50" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="180" r="3" fill="#d62976" opacity="0.7"><animate attributeName="cy" values="180;30;180" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="30" r="2" fill="#ea4335" opacity="0.8"><animate attributeName="cy" values="30;220;30" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="150" r="3" fill="#fbbc05" opacity="0.7"><animate attributeName="cy" values="150;40;150" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="80" r="2" fill="#00c6ff" opacity="0.8"><animate attributeName="cy" values="80;180;80" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="200" r="2" fill="#1877f2" opacity="0.6"><animate attributeName="cy" values="200;50;200" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="120" r="1.5" fill="#ea4335" opacity="0.5"><animate attributeName="r" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="200" r="1.5" fill="#fbbc05" opacity="0.5"><animate attributeName="r" values="1.5;3;1.5" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
  <!-- Main title with glow -->
  <text x="400" y="90" text-anchor="middle" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="url(#g1)" filter="url(#gl)" letter-spacing="4">RASHD BRO</text>
  <!-- Animated underline -->
  <rect x="100" y="110" width="600" height="3" fill="url(#g1)" rx="1.5" opacity="0.8"><animate attributeName="x" values="100;200;100" dur="2s" repeatCount="indefinite"/><animate attributeName="width" values="600;400;600" dur="2s" repeatCount="indefinite"/></rect>
  <!-- Subtitle -->
  <text x="400" y="140" text-anchor="middle" font-family="Arial" font-size="20" fill="#00c6ff" opacity="0.9" letter-spacing="2">Neon Edition v3.0</text>
  <!-- Flash text -->
  <text x="400" y="165" text-anchor="middle" font-family="Courier New" font-size="14" fill="#fbbc05" opacity="0.7">⚡ FB + INSTA + MAIL ⚡</text>
  <!-- Pulsing dots -->
  <circle cx="380" cy="210" r="4" fill="#ea4335"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="210" r="4" fill="#fbbc05"><animate attributeName="r" values="4;7;4" dur="1.5s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="210" r="4" fill="#00c6ff"><animate attributeName="r" values="4;7;4" dur="1.5s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="440" cy="210" r="4" fill="#1877f2"><animate attributeName="r" values="4;7;4" dur="1.5s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  <!-- Bottom bar -->
  <rect x="0" y="245" width="800" height="5" fill="url(#g1)" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></rect>
  <!-- Corner decorations -->
  <text x="20" y="240" font-family="Arial" font-size="10" fill="#666" opacity="0.5">RASHD BRO · v3.0</text>
</svg>
