<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1877f2;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#d62976;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#fbbc05;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1877f2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" fill="#0a0a1a"/>
  <!-- Animated background particles -->
  <circle cx="100" cy="50" r="2" fill="#1877f2" opacity="0.8">
    <animate attributeName="cy" values="50;150;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="150" r="3" fill="#d62976" opacity="0.8">
    <animate attributeName="cy" values="150;50;150" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="80" r="2" fill="#ea4335" opacity="0.8">
    <animate attributeName="cy" values="80;180;80" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="120" r="3" fill="#fbbc05" opacity="0.8">
    <animate attributeName="cy" values="120;40;120" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="180" r="1.5" fill="#00c6ff" opacity="0.6">
    <animate attributeName="cy" values="180;60;180" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="170" r="2" fill="#00c6ff" opacity="0.6">
    <animate attributeName="cy" values="170;40;170" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Main title with glow -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#grad1)" filter="url(#glow)" letter-spacing="3">RASHD BRO</text>
  <!-- Neon line animation -->
  <line x1="150" y1="110" x2="650" y2="110" stroke="url(#grad1)" stroke-width="2" opacity="0.8">
    <animate attributeName="x1" values="150;200;150" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="650;600;650" dur="2s" repeatCount="indefinite"/>
  </line>
  <!-- Subtitle -->
  <text x="400" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#00c6ff" opacity="0.9">Neon Edition v3.0</text>
  <!-- Animated dots -->
  <circle cx="400" cy="175" r="4" fill="#ea4335">
    <animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="175" r="4" fill="#fbbc05">
    <animate attributeName="r" values="4;8;4" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="430" cy="175" r="4" fill="#00c6ff">
    <animate attributeName="r" values="4;8;4" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Bottom neon bar -->
  <rect x="0" y="190" width="800" height="10" fill="url(#grad2)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
